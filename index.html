<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACL Recovery Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --bg-card: #252525;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent: #4ade80;
            --border: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            padding-bottom: 100px;
        }

        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .phase-badge {
            display: inline-block;
            background: var(--accent);
            color: #000;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .day-info {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--bg-secondary);
            border-radius: 3px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            padding: 14px 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .tab.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .tab:hover:not(.active) {
            background: var(--bg-card);
        }

        .routine-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--text-secondary);
        }

        .exercise-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }

        .exercise-card.completed {
            opacity: 0.6;
            border-color: var(--accent);
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            gap: 10px;
        }

        .exercise-info {
            flex: 1;
        }

        .exercise-name {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .exercise-reps {
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 500;
        }

        .equipment-tag {
            display: inline-block;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-left: 8px;
            vertical-align: middle;
        }

        .exercise-content {
            display: flex;
            gap: 12px;
        }

        .exercise-diagram {
            flex-shrink: 0;
            width: 100px;
            height: 100px;
            background: var(--bg-secondary);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .exercise-diagram img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .exercise-icon-container {
            flex-shrink: 0;
            width: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .exercise-icon {
            font-size: 2.5rem;
            opacity: 0.6;
        }

        .sets-container.full-width {
            flex: 1;
        }

        .sets-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sets-grid {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .set-btn {
            width: 44px;
            height: 44px;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .set-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: scale(1.05);
        }

        .set-btn.completed {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
        }

        .set-btn:active {
            transform: scale(0.95);
        }

        .exercise-cue {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .completion-celebration {
            display: none;
            background: linear-gradient(135deg, var(--accent) 0%, #22c55e 100%);
            color: #000;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 20px;
            animation: celebratePulse 0.5s ease-out;
        }

        .completion-celebration.show {
            display: block;
        }

        @keyframes celebratePulse {
            0% { transform: scale(0.9); opacity: 0; }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); opacity: 1; }
        }

        .phase-info {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-top: 30px;
        }

        .phase-info h3 {
            font-size: 1rem;
            margin-bottom: 10px;
            color: var(--accent);
        }

        .phase-info p {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .completed-count {
            text-align: center;
            padding: 15px;
            background: var(--bg-secondary);
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .completed-count span {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
        }

        .reset-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            cursor: pointer;
            margin-top: 20px;
        }

        .reset-btn:hover {
            background: var(--bg-card);
            color: var(--text-primary);
        }

        .hidden {
            display: none !important;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            .exercise-card {
                padding: 12px;
            }

            .exercise-diagram {
                width: 80px;
                height: 80px;
            }

            .set-btn {
                width: 40px;
                height: 40px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧘 ACL Recovery</h1>
            <div class="phase-badge" id="phaseBadge">Loading...</div>
            <div class="day-info" id="dayInfo">Day 0</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
        </header>

        <div class="completed-count">
            <span id="completedCount">0</span> / <span id="totalCount">0</span> sets completed
        </div>

        <div class="tabs">
            <button class="tab active" data-routine="home">🏠 Home Routine</button>
            <button class="tab" data-routine="gym">🏋️ Gym Routine</button>
        </div>

        <div id="homeRoutine">
            <div class="routine-title">3× Daily • Yoga Mat + Bands</div>
            <div id="homeExercises"><div class="loading">Loading exercises...</div></div>
        </div>

        <div id="gymRoutine" class="hidden">
            <div class="routine-title">Morning • Equipment Available</div>
            <div id="gymExercises"><div class="loading">Loading exercises...</div></div>
        </div>

        <div class="completion-celebration" id="celebration">
            <h3>🎉 All Done!</h3>
            <p>Great work today. Your knee is getting stronger.</p>
        </div>

        <div class="phase-info">
            <h3 id="phaseFocusTitle">Loading...</h3>
            <p id="phaseFocusText">Please wait...</p>
        </div>

        <button class="reset-btn" onclick="resetDay()">🔄 Reset Today's Progress</button>
    </div>

    <script>
        // Application state
        let programData = null;
        let currentRoutine = 'home';
        let state = {};
        let startDate = null;

        // Initialize on load
        async function init() {
            try {
                // Load exercise program from JSON
                const response = await fetch('exercises.json');
                if (!response.ok) throw new Error('Failed to load exercises');
                programData = await response.json();
                
                // Set start date from program
                startDate = new Date(programData.metadata.startDate);
                
                // Load saved state
                const today = getTodayKey();
                state = JSON.parse(localStorage.getItem('acl_rehab_state') || '{}');
                
                if (!state[today]) {
                    state[today] = { home: {}, gym: {} };
                }

                updateUI();
                setupEventListeners();
            } catch (error) {
                console.error('Failed to initialize:', error);
                document.getElementById('phaseBadge').textContent = 'Error';
                document.getElementById('dayInfo').textContent = 'Failed to load program';
            }
        }

        function getTodayKey() {
            const now = new Date();
            return now.getFullYear() + '-' + 
                   String(now.getMonth() + 1).padStart(2, '0') + '-' + 
                   String(now.getDate()).padStart(2, '0');
        }

        function getDayNumber() {
            const now = new Date();
            const diffTime = now - startDate;
            return Math.max(0, Math.floor(diffTime / (1000 * 60 * 60 * 24)));
        }

        function getCurrentPhase(dayNumber) {
            const phases = programData.metadata.phasesConfig;
            let cumulativeDays = 0;
            for (let phase = 1; phase <= programData.metadata.phases; phase++) {
                cumulativeDays += phases[phase].duration;
                if (dayNumber < cumulativeDays) return phase;
            }
            return programData.metadata.phases;
        }

        function getPhaseProgress(dayNumber, phase) {
            const phases = programData.metadata.phasesConfig;
            let startDays = 0;
            for (let p = 1; p < phase; p++) startDays += phases[p].duration;
            return Math.min(100, Math.max(0, ((dayNumber - startDays) / phases[phase].duration) * 100));
        }

        function getImageUrl(imgKey) {
            if (!imgKey) return '';
            const base = programData.metadata.images.base;
            const path = programData.metadata.images.exercises[imgKey];
            return path ? base + '/' + path : '';
        }

        function updateUI() {
            const dayNumber = getDayNumber();
            const phase = getCurrentPhase(dayNumber);
            const phases = programData.metadata.phasesConfig;

            document.getElementById('phaseBadge').textContent = phases[phase].name;
            document.getElementById('dayInfo').textContent = 'Day ' + dayNumber + ' • Weeks ' + phases[phase].weeks;
            document.getElementById('progressFill').style.width = getPhaseProgress(dayNumber, phase) + '%';
            
            const focus = programData.metadata.phaseFocus[phase];
            document.getElementById('phaseFocusTitle').textContent = '📋 ' + phases[phase].name + ' Focus (Weeks ' + phases[phase].weeks + ')';
            document.getElementById('phaseFocusText').textContent = focus;

            renderExercises('home', programData.home[phase]);
            renderExercises('gym', programData.gym[phase]);
            updateCounts();
        }

        // Parse sets/reps from string like "3×30 reps" or "15-20 min"
        function parseSets(setsStr) {
            if (!setsStr) return { sets: 1, reps: 0 };
            if (setsStr.includes('min')) {
                return { sets: 1, reps: 'continuous' };
            }
            const match = setsStr.match(/(\d+)[×x](\d+)/);
            if (match) {
                return { sets: parseInt(match[1]), reps: parseInt(match[2]) };
            }
            const singleMatch = setsStr.match(/(\d+)\s*(reps?|sec)/i);
            if (singleMatch) {
                return { sets: 1, reps: parseInt(singleMatch[1]) };
            }
            return { sets: 1, reps: 0 };
        }

        function renderExercises(routine, exercises) {
            const container = document.getElementById(routine + 'Exercises');
            const today = getTodayKey();
            const todayState = state[today] && state[today][routine] ? state[today][routine] : {};

            if (!exercises || exercises.length === 0) {
                container.innerHTML = '<div class="loading">No exercises for this phase yet.</div>';
                return;
            }

            container.innerHTML = exercises.map(function(ex) {
                const parsed = parseSets(ex.sets);
                const exerciseState = todayState[ex.id] || { completedSets: [] };
                const completedCount = exerciseState.completedSets ? exerciseState.completedSets.filter(Boolean).length : 0;
                const isExerciseComplete = completedCount >= parsed.sets;
                const equipmentTag = ex.equipment ? '<span class="equipment-tag">' + ex.equipment + '</span>' : '';
                const imgUrl = ex.img ? getImageUrl(ex.img) : '';
                const hasImage = routine === 'gym' && imgUrl;
                
                let setsHtml = '';
                if (parsed.sets === 1 && parsed.reps === 'continuous') {
                    const isComplete = exerciseState.completedSets && exerciseState.completedSets[0];
                    setsHtml = '<div class="set-btn ' + (isComplete ? 'completed' : '') + '" onclick="toggleSet(\'' + routine + '\', \'' + ex.id + '\', 0)">✓</div>';
                } else {
                    for (let i = 0; i < parsed.sets; i++) {
                        const isSetComplete = exerciseState.completedSets && exerciseState.completedSets[i];
                        setsHtml += '<div class="set-btn ' + (isSetComplete ? 'completed' : '') + '" onclick="toggleSet(\'' + routine + '\', \'' + ex.id + '\', ' + i + ')">' + (i + 1) + '</div>';
                    }
                }

                const imageHtml = hasImage 
                    ? '<div class="exercise-diagram"><img src="' + imgUrl + '" alt="' + ex.name + '" loading="lazy"></div>'
                    : '<div class="exercise-icon">🧘</div>';

                return '<div class="exercise-card ' + (isExerciseComplete ? 'completed' : '') + '" data-exercise="' + ex.id + '">' +
                    '<div class="exercise-header">' +
                    '<div class="exercise-info">' +
                    '<div class="exercise-name">' + ex.name + equipmentTag + '</div>' +
                    '<div class="exercise-reps">' + ex.sets + '</div>' +
                    '</div>' +
                    '</div>' +
                    '<div class="exercise-content">' +
                    (hasImage ? imageHtml : '<div class="exercise-icon-container">' + imageHtml + '</div>') +
                    '<div class="sets-container' + (hasImage ? '' : ' full-width') + '">' +
                    '<div class="sets-grid">' + setsHtml + '</div>' +
                    '<div class="exercise-cue">' + ex.cue + '</div>' +
                    '</div>' +
                    '</div>' +
                    '</div>';
            }).join('');
        }

        function toggleSet(routine, exerciseId, setIndex) {
            const today = getTodayKey();
            if (!state[today]) state[today] = { home: {}, gym: {} };
            if (!state[today][routine]) state[today][routine] = {};
            if (!state[today][routine][exerciseId]) {
                state[today][routine][exerciseId] = { completedSets: [] };
            }
            if (!state[today][routine][exerciseId].completedSets) {
                state[today][routine][exerciseId].completedSets = [];
            }

            // Toggle this set
            if (state[today][routine][exerciseId].completedSets[setIndex]) {
                state[today][routine][exerciseId].completedSets[setIndex] = false;
            } else {
                state[today][routine][exerciseId].completedSets[setIndex] = true;
            }

            localStorage.setItem('acl_rehab_state', JSON.stringify(state));
            updateUI();
        }

        function updateCounts() {
            const today = getTodayKey();
            const todayState = state[today] || {};
            const dayNumber = getDayNumber();
            const phase = getCurrentPhase(dayNumber);
            
            const exercises = currentRoutine === 'home' ? programData.home[phase] : programData.gym[phase];
            
            let totalSets = 0;
            let completedSets = 0;

            exercises.forEach(function(ex) {
                const parsed = parseSets(ex.sets);
                const exerciseState = todayState[currentRoutine] && todayState[currentRoutine][ex.id];
                
                if (parsed.sets === 1 && parsed.reps === 'continuous') {
                    totalSets += 1;
                    if (exerciseState && exerciseState.completedSets && exerciseState.completedSets[0]) {
                        completedSets += 1;
                    }
                } else {
                    totalSets += parsed.sets;
                    if (exerciseState && exerciseState.completedSets) {
                        completedSets += exerciseState.completedSets.filter(Boolean).length;
                    }
                }
            });

            document.getElementById('completedCount').textContent = completedSets;
            document.getElementById('totalCount').textContent = totalSets;

            const celebration = document.getElementById('celebration');
            if (completedSets === totalSets && totalSets > 0) {
                celebration.classList.add('show');
            } else {
                celebration.classList.remove('show');
            }
        }

        function setupEventListeners() {
            document.querySelectorAll('.tab').forEach(function(tab) {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
                    tab.classList.add('active');
                    currentRoutine = tab.dataset.routine;
                    document.getElementById('homeRoutine').classList.toggle('hidden', currentRoutine !== 'home');
                    document.getElementById('gymRoutine').classList.toggle('hidden', currentRoutine !== 'gym');
                    updateCounts();
                });
            });
        }

        function resetDay() {
            const today = getTodayKey();
            if (confirm('Reset all exercises for today?')) {
                state[today] = { home: {}, gym: {} };
                localStorage.setItem('acl_rehab_state', JSON.stringify(state));
                updateUI();
            }
        }

        // Start the app
        init();
    </script>
</body>
</html>
